services:
  postgres-backend:
    image: postgres:latest
    container_name: pagila_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: postgres
      PGDATA: "/var/lib/postgresql/data/pgdata"
    ports:
      - "5430:5432"
    volumes:
      - ./pagila/pagila-schema.sql:/docker-entrypoint-initdb.d/1-pagila-schema.sql
      - ./pagila/pagila-schema-jsonb.sql:/docker-entrypoint-initdb.d/1-pagila-schema-jsonb.sql
      - ./pagila/pagila-data.sql:/docker-entrypoint-initdb.d/2-pagila-data.sql
      - ./pagila/restore-pagila-data-jsonb.sh:/docker-entrypoint-initdb.d/3-restore-pagila-data-jsonb.sh
      - ./pagila/pagila-data-yum-jsonb.backup:/docker-entrypoint-initdb.d/pagila-data-yum-jsonb.backup
      - ./pagila/pagila-data-apt-jsonb.backup:/docker-entrypoint-initdb.d/pagila-data-apt-jsonb.backup
      - pagila-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4G
  postgres-dwh:
    image: postgres:latest
    container_name: pagila_dwh
    depends_on:
      postgres-backend:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${DWH_USER:-dwh_dev}
      POSTGRES_PASSWORD: ${DWH_PASSWORD:-password}
      POSTGRES_DB: ${DWH_DB:-dwh}
      PGDATA: "/var/lib/postgresql/data/pgdata"
    ports:
      - "${DWH_PORT:-5431}:5432"
    volumes:
      - ./dwh/init-fdw.sql:/docker-entrypoint-initdb.d/init-fdw.sql
      - dwh-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DWH_USER:-dwh_dev} -d ${DWH_DB:-dwh} && nc -z postgres-backend 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4G


volumes:
    pagila-data:
    dwh-data:
